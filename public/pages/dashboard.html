<!doctype html><html><head><meta charset=utf-8><title>Dashboard</title><link rel=stylesheet href=/css/app.css></head><body>
<header><h1>Dashboard</h1><nav class=row><a href=/>Home</a><a href=/map>Map</a><a href=/live-location>Live Location</a><a href=/profile>Profile</a><a href=/settings>Settings</a><button id=logout>Logout</button></nav></header>
<main><div class=card><p id=msg class=status>Welcome.</p></div></main>
<script src=/js/app.js></script><script>
async function init(){try{const me=await api('/api/v1/auth/me'); document.querySelector('#msg').textContent='Welcome '+me.data.user.display_name;}catch(e){location.href='/login';}}
init();
document.getElementById('logout').onclick=async()=>{await api('/api/v1/auth/logout',{method:'POST'});location.href='/login';};
</script></body></html>
