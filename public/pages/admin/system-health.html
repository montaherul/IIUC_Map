<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin · System health - IIUC Live Campus Map</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="admin-page">
  <div class="app-shell">
    <header class="admin-header">
      <h1>Admin &middot; System health</h1>
      <div class="admin-session" id="session">checking&hellip;</div>
      <div class="admin-actions">
        <nav class="row">
          <a href="/admin/dashboard">Dashboard</a>
          <a href="/map">Map</a>
          <button id="logout">Logout</button>
        </nav>
      </div>
    </header>
    <div class="app-body">
      <aside class="admin-sidebar">
        <h2>Admin</h2>
        <nav class="side-nav">
          <a href="/admin/dashboard">Dashboard</a>
          <a href="/admin/users">Users</a>
          <a href="/admin/campus">Campus</a>
          <a href="/admin/markers">Markers</a>
          <a href="/admin/categories">Categories</a>
          <a href="/admin/locations">Locations</a>
          <a href="/admin/logs">Logs</a>
          <a href="/admin/settings">Settings</a>
          <a href="/admin/system-health" aria-current="page">System health</a>
        </nav>
      </aside>
      <main class="admin-main">
        <p id="msg" class="status"></p>
        <button class="secondary" id="btnRefresh">Refresh</button>
        <div class="health-grid" id="healthGrid"></div>
        <p id="healthRaw" class="muted" style="font-size:12px;max-width:900px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></p>
      </main>
    </div>
    <footer class="admin-footer">IIUC Live Campus Map &middot; Admin</footer>
  </div>
  <script src="/js/app.js"></script>
  <script>
    const msg = $('#msg');
    function show(t, cls='status'){ msg.textContent=t; msg.className=cls; }
    async function init(){
      try{
        const me = await api('/api/v1/auth/me');
        $('#session').textContent = `${me.data.user.display_name || me.data.user.email} (${me.data.user.role})`;
        if (me.data.user.role !== 'admin'){ show('Admin role required.','status error'); return; }
        await loadHealth();
      } catch(e){ location.href='/login?next=/admin/system-health'; }
    }
    function badgeFor(status){
      if (status === 'up' || status === 'ok') return '<span class="badge ok">up</span>';
      if (status === 'degraded') return '<span class="badge warn">degraded</span>';
      return '<span class="badge err">down</span>';
    }
    async function loadHealth(){
      const d = await api('/api/v1/admin/system-health');
      const h = d.data.health || d.data;
      $('#healthGrid').innerHTML = [
        healthCard('Overall', h.status === 'ok' ? 'ok' : h.status === 'degraded' ? 'warn' : 'err', h.status),
        healthCard('Database', h.db.status, h.db.status + (h.db.latencyMs != null ? ` &middot; ${h.db.latencyMs}ms` : '')),
        healthCard('Sockets', h.socket.status, h.socket.status + ` (${h.socket.clients} clients)`),
        healthCard('Uptime', 'ok', Math.floor(h.uptimeSeconds / 3600) + 'h ' + Math.floor((h.uptimeSeconds % 3600) / 60) + 'm'),
        healthCard('Version', 'ok', h.version),
        healthCard('Last backup', h.lastBackup ? 'ok' : 'warn', h.lastBackup || 'none recorded'),
        healthCard('Checked', 'ok', h.checkedAt),
      ].join('');
      $('#healthRaw').textContent = 'Raw: ' + JSON.stringify(h);
      $('#msg').textContent = '';
    }
    function healthCard(label, cls, value){
      return `<div class="health-card"><div class="muted" style="font-size:12px">${esc(label)}</div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px"><span class="badge ${cls}">${esc(String(value))}</span></div></div>`;
    }
    $('#btnRefresh').onclick = loadHealth;
    $('#logout').onclick = async ()=>{ try{ await api('/api/v1/auth/logout',{method:'POST'}); location.href='/login'; } catch(e){ show(e.message,'status error'); } };
    init();
  </script>
</body>
</html>
